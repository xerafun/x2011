<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>SVG 导出 PNG ICO</title>
  <style>
    body {
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      font-family: sans-serif;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 24px;
    }

    .logos {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .logo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-card span {
      font-size: 14px;
      color: #aaa;
    }

    svg,
    canvas {
      border: 1px solid #555;
      border-radius: 8px;
    }

    .btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #00bcd4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 188, 212, 0.5);
    }
  </style>
</head>

<body>

  <h1>X Logo 导出工具</h1>

  <div class="logos">
    <!-- 黑色 Logo -->
    <div class="logo-card">
      <svg viewBox="0 0 100 100" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <line x1="30.3" y1="30.3" x2="69.7" y2="69.7" stroke="black" stroke-width="14" stroke-linecap="square" />
        <line x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke="black" stroke-width="14" stroke-linecap="square" />
      </svg>
      <span>黑色 Logo</span>
      <button id="btnBlack">🖤 下载</button>
    </div>

    <!-- 白色 Logo -->
    <div class="logo-card">
      <svg viewBox="0 0 100 100" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <line x1="30.3" y1="30.3" x2="69.7" y2="69.7" stroke="white" stroke-width="14" stroke-linecap="square" />
        <line x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke="white" stroke-width="14" stroke-linecap="square" />
      </svg>
      <span>白色 Logo</span>
      <button id="btnWhite">⚪ 下载</button>
    </div>

    <!-- 黑白双层 Logo -->
    <div class="logo-card">
      <svg viewBox="0 0 100 100" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <!-- 底层边框色 -->
        <line x1="30.3" y1="30.3" x2="69.7" y2="69.7" stroke="#282828" stroke-width="21" stroke-linecap="square" />
        <line x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke="#282828" stroke-width="21" stroke-linecap="square" />
        <!-- 上层内部色 -->
        <line x1="30.3" y1="30.3" x2="69.7" y2="69.7" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square" />
        <line x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square" />
      </svg>
      <span>黑白双层</span>
      <button id="btnLayered" style="background: #333; border: 1px solid #555;">🐼 下载</button>
    </div>

    <!-- 黑白交叉 Logo -->
    <div class="logo-card">
      <svg viewBox="0 0 100 100" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <line x1="30.3" y1="30.3" x2="69.7" y2="69.7" stroke="black" stroke-width="14" stroke-linecap="square" />
        <!-- 上层白色 (带黑边) -->
        <line x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke="black" stroke-width="18" stroke-linecap="square" />
        <line x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke="white" stroke-width="14" stroke-linecap="square" />
      </svg>
      <span>黑白交叉</span>
      <button id="btnCrossing"
        style="background: linear-gradient(135deg, #000 50%, #fff 50%); border: 1px solid #555;">❌ 下载</button>
    </div>
  </div>

  <h2 style="margin-top: 40px; font-size: 18px;">Favicon 生成 (64x64)</h2>
  <div class="btns" style="margin-top: 16px;">
    <button id="btnFaviconBlack">🖤 黑色 Favicon</button>
    <button id="btnFaviconWhite">⚪ 白色 Favicon</button>
    <button id="btnFaviconLayered" style="background: #333; border: 1px solid #555;">🐼 黑白 Favicon</button>
    <button id="btnFaviconCrossing"
      style="background: linear-gradient(135deg, #000 50%, #fff 50%); border: 1px solid #555;">❌ 交叉 Favicon</button>
  </div>

  <script>
    // 导出简单 SVG Logo
    function exportSimplePNG({ color, background, filename }) {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 透明背景
      ctx.clearRect(0, 0, size, size);

      // 画 X (按 x-circle 线宽 14%、方头 square cap)
      ctx.strokeStyle = color;
      ctx.lineWidth = size * 0.14;
      ctx.lineCap = 'square';
      const margin = size * 0.303;

      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(size - margin, size - margin);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(margin, size - margin);
      ctx.lineTo(size - margin, margin);
      ctx.stroke();

      const png = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = png;
      a.download = filename;
      a.click();
    }

    // 黑色 Logo
    document.getElementById('btnBlack').addEventListener('click', () => {
      exportSimplePNG({
        color: 'black',
        filename: 'cross-black.png'
      });
    });

    // 白色 Logo
    document.getElementById('btnWhite').addEventListener('click', () => {
      exportSimplePNG({
        color: 'white',
        filename: 'cross-white.png'
      });
    });

    // 绘制黑白双层 Logo
    function drawLayered(canvas, size) {
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;

      // 透明背景
      ctx.clearRect(0, 0, size, size);

      // Square Cap 校正：由于 square 会延伸半个线宽，需要内缩起点以保持视觉尺寸一致
      // 偏移量 = (lineWidth/2) * cos(45) = (0.15/2 * 0.707) * size ≈ 0.053 * size
      // 原 Margin 0.25 -> 新 Margin 0.303
      const margin = size * 0.303;

      // 1. 绘制底层边框色 (粗)
      ctx.strokeStyle = '#282828';
      ctx.lineWidth = size * 0.21; // 21% width
      ctx.lineCap = 'square';

      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(size - margin, size - margin);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(margin, size - margin);
      ctx.lineTo(size - margin, margin);
      ctx.stroke();

      // 2. 绘制上层内部色 (细, 按 x-circle 线宽 14%)
      ctx.strokeStyle = '#CCCCCC';
      ctx.lineWidth = size * 0.14; // 14% width

      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(size - margin, size - margin);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(margin, size - margin);
      ctx.lineTo(size - margin, margin);
      ctx.stroke();
    }

    // 黑白双层 Logo 下载
    document.getElementById('btnLayered').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      drawLayered(canvas, 1024);
      const png = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = png;
      a.download = 'cross-layered.png';
      a.click();
    });

    // 绘制黑白交叉 Logo (按 x-circle 线宽 14% 更新)
    function drawCrossing(canvas, size) {
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;
      ctx.clearRect(0, 0, size, size);
      const margin = size * 0.303;

      ctx.lineCap = 'square';

      // 1. 底层黑色 (\)
      ctx.strokeStyle = 'black';
      ctx.lineWidth = size * 0.14;
      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(size - margin, size - margin);
      ctx.stroke();

      // 2. 上层白色 (/) 带黑边 (黑边 18%, 白色前景 14%)
      // 背景黑
      ctx.strokeStyle = 'black';
      ctx.lineWidth = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(margin, size - margin);
      ctx.lineTo(size - margin, margin);
      ctx.stroke();

      // 前景白
      ctx.strokeStyle = 'white';
      ctx.lineWidth = size * 0.14;
      ctx.beginPath();
      ctx.moveTo(margin, size - margin);
      ctx.lineTo(size - margin, margin);
      ctx.stroke();
    }

    // 黑白交叉 Logo 下载
    document.getElementById('btnCrossing').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      drawCrossing(canvas, 1024);
      const png = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = png;
      a.download = 'cross-crossing.png';
      a.click();
    });

    // Favicon 导出函数 (64x64 ICO)
    function exportFavicon(drawFn, filename) {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      drawFn(canvas, 64);

      // 获取图像数据
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, 64, 64);

      // 构建 ICO 文件
      const ico = createICO(imageData, 64, 64);
      const blob = new Blob([ico], { type: 'image/x-icon' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 创建 ICO 文件二进制数据
    function createICO(imageData, width, height) {
      const bmpInfoSize = 40;
      const pixelDataSize = width * height * 4;
      const maskSize = Math.ceil(width / 8) * height;
      const imageSize = bmpInfoSize + pixelDataSize + maskSize;

      // ICO 文件头 (6 bytes) + 目录项 (16 bytes) + 图像数据
      const buffer = new ArrayBuffer(6 + 16 + imageSize);
      const view = new DataView(buffer);

      // ICO 文件头
      view.setUint16(0, 0, true);      // 保留
      view.setUint16(2, 1, true);      // 类型 (1 = ICO)
      view.setUint16(4, 1, true);      // 图像数量

      // 目录项
      view.setUint8(6, width === 256 ? 0 : width);   // 宽度
      view.setUint8(7, height === 256 ? 0 : height); // 高度
      view.setUint8(8, 0);             // 调色板数
      view.setUint8(9, 0);             // 保留
      view.setUint16(10, 1, true);     // 颜色平面
      view.setUint16(12, 32, true);    // 位深度
      view.setUint32(14, imageSize, true);  // 图像大小
      view.setUint32(18, 22, true);    // 图像数据偏移

      // BMP 信息头 (BITMAPINFOHEADER)
      let offset = 22;
      view.setUint32(offset, bmpInfoSize, true); offset += 4;
      view.setInt32(offset, width, true); offset += 4;
      view.setInt32(offset, height * 2, true); offset += 4; // 高度 x2 (包含掩码)
      view.setUint16(offset, 1, true); offset += 2;  // 平面数
      view.setUint16(offset, 32, true); offset += 2; // 位深度
      view.setUint32(offset, 0, true); offset += 4;  // 压缩方式
      view.setUint32(offset, pixelDataSize + maskSize, true); offset += 4;
      view.setInt32(offset, 0, true); offset += 4;
      view.setInt32(offset, 0, true); offset += 4;
      view.setUint32(offset, 0, true); offset += 4;
      view.setUint32(offset, 0, true); offset += 4;

      // 像素数据 (BGRA, 从下到上)
      const pixels = imageData.data;
      for (let y = height - 1; y >= 0; y--) {
        for (let x = 0; x < width; x++) {
          const srcIdx = (y * width + x) * 4;
          view.setUint8(offset++, pixels[srcIdx + 2]); // B
          view.setUint8(offset++, pixels[srcIdx + 1]); // G
          view.setUint8(offset++, pixels[srcIdx + 0]); // R
          view.setUint8(offset++, pixels[srcIdx + 3]); // A
        }
      }

      // AND 掩码 (全 0 = 完全不透明, 由 alpha 通道处理)
      for (let i = 0; i < maskSize; i++) {
        view.setUint8(offset++, 0);
      }

      return buffer;
    }

    // 简单 Favicon 绘制 (按 x-circle 线宽 14%)
    function drawSimpleFavicon(canvas, size, color) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.strokeStyle = color;
      ctx.lineWidth = size * 0.14;
      ctx.lineCap = 'square';
      const margin = size * 0.303;
      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(size - margin, size - margin);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(margin, size - margin);
      ctx.lineTo(size - margin, margin);
      ctx.stroke();
    }

    // 黑色 Favicon
    document.getElementById('btnFaviconBlack').addEventListener('click', () => {
      exportFavicon((c, s) => drawSimpleFavicon(c, s, 'black'), 'favicon.ico');
    });

    // 白色 Favicon
    document.getElementById('btnFaviconWhite').addEventListener('click', () => {
      exportFavicon((c, s) => drawSimpleFavicon(c, s, 'white'), 'favicon.ico');
    });

    // 黑白 Favicon
    document.getElementById('btnFaviconLayered').addEventListener('click', () => {
      exportFavicon(drawLayered, 'favicon.ico');
    });

    // 交叉 Favicon
    document.getElementById('btnFaviconCrossing').addEventListener('click', () => {
      exportFavicon(drawCrossing, 'favicon.ico');
    });
  </script>

</body>

</html>
